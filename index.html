<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FocusFlow – Plan Your Day</title>

    <!-- CSS -->
    <link rel="stylesheet" href="CSS/reset.css" />
    <link rel="stylesheet" href="CSS/main.css" />
</head>
<body>
    <button id="theme-toggle" title="Toggle light/dark mode">🌙</button>

    <header>
        <h1>FocusFlow</h1>
        <p>Do what you planned. Not what distracts you.</p>
    </header>

    <main>
        <!-- Add Task Section -->
        <section id="add-task">
            <h2>Plan Your Day</h2>

            <input type="time" id="taskTime" />
            <input type="text" id="taskInput" placeholder="What should you be doing?" />
            <button id="add-btn">Add</button>
        </section>

        <!-- Current Task -->
        <section id="current-task">
            <h2>Right Now</h2>
            <p id="active-task">No task right now</p>
        </section>

        <!-- Daily Schedule -->
        <section id = "score">
            <div id="daily-score">
                <strong>Today:</strong>
                <span id="score-text">0 / 0 completed</span>
            </div>

            <div id = "progress-container">
                <div id = "progress-bar"></div>
            </div>
        </section>

        <div id="streak">
    🔥      Streak: <span id="streak-count">0</span> days
        </div>



        <section id="schedule">
            <h2>Today’s Plan</h2>
            <ul id="task-list"></ul>
        </section>

        <div id="focus-mode" class="hidden is-work">
        <div id="focus-phase-label">Focus</div>
        <div id="focus-timer">25:00</div>
        <div id="focus-task"></div>
        <div id="focus-cycle-count">Cycle 0</div>

        <button id="pause-focus">Pause</button>
        <button id="exit-focus">Exit</button>
        </div>
    </main>

    <!-- JS -->
    <script type="module" src="JS/app.js"></script>
    <script>
        const toggle = document.getElementById('theme-toggle');
        const saved = localStorage.getItem('ff-theme');
        if (saved === 'light') { document.body.classList.add('light'); toggle.textContent = '☀️'; }

        toggle.addEventListener('click', () => {
            const isLight = document.body.classList.toggle('light');
            toggle.textContent = isLight ? '☀️' : '🌙';
            localStorage.setItem('ff-theme', isLight ? 'light' : 'dark');
        });
    </script>

    <footer class ="footer">
        <p> &copy; 2026 <span class ="brand">TwentyTwo Creations</span>  | Developed by Cibah22</p>
    </footer>
</body>
</html>
